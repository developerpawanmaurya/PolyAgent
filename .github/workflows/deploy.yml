name: Deploy to main

on:
  # Run on every push to main
  push:
    branches: [main]
  # Also allow manual triggering from the Actions tab
  workflow_dispatch:

# Permissions to push changes back to the repo
permissions:
  contents: write

# Only one concurrent deployment, but don't cancel in-progress runs
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Commit and push docs folder
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add docs/
          git commit -m "build: update docs folder" || echo "No changes to commit"
          git push
